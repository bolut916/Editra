<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Menü</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#fbf8f1;--tx:#1f1a14;--ac:#b3261e;--mu:color-mix(in srgb,var(--tx) 62%,var(--bg));--ln:color-mix(in srgb,var(--tx) 14%,var(--bg));--fh:Georgia,"Times New Roman",serif;--fb:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 var(--fb);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:640px;margin:0 auto;padding:34px 20px 40px}
header{text-align:center;padding:8px 0 22px;border-bottom:2px solid var(--ac);margin-bottom:8px}
h1{margin:0;font:700 clamp(34px,10vw,52px)/1 var(--fh);letter-spacing:-.01em;text-transform:none;overflow-wrap:anywhere}
.sub{margin:10px 0 0;color:var(--mu);font-size:16px}
nav{position:sticky;top:0;z-index:2;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--ln)}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--ln);color:var(--tx);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
nav a:active{background:var(--ln)}
section{padding-top:26px;scroll-margin-top:64px}
h2{margin:0 0 12px;font:700 26px/1.15 var(--fh);color:var(--ac);overflow-wrap:anywhere}
ul{list-style:none;margin:0;padding:0}
li{padding:12px 0;border-bottom:1px dashed var(--ln)}
.r{display:flex;align-items:baseline;gap:10px}
.n{font-weight:650;overflow-wrap:anywhere}
.d{flex:1;border-bottom:1.5px dotted var(--ln);transform:translateY(-4px);min-width:16px}
.p{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.x{margin:3px 0 0;color:var(--mu);font-size:15px}
.note{margin:28px 0 0;text-align:center;color:var(--mu);font-size:14px}
footer{margin-top:34px;text-align:center;font-size:12.5px;color:var(--mu)}
footer a{color:var(--mu)}
.err{max-width:480px;margin:18vh auto;padding:0 24px;text-align:center}
@media print{nav{display:none}body{background:#fff}}
</style>
</head><body>
<main id="m" aria-live="polite"><p class="err">…</p></main>
<script>
(function(){'use strict';
var M=document.getElementById('m'),lang=(navigator.language||'tr').toLowerCase().indexOf('tr')===0?'tr':'en';
var T=lang==='tr'?{bad:'Bu menü bağlantısı okunamadı. QR kodu yeniden okutmayı dene.',old:'Bu menüyü açmak için tarayıcını güncellemen gerekiyor.',made:'Vybble ile hazırlandı',all:'Bölümler'}:{bad:'This menu link could not be read. Try scanning the QR code again.',old:'Please update your browser to open this menu.',made:'Made with Vybble',all:'Sections'};
document.documentElement.lang=lang;
function err(t){M.innerHTML='';var p=document.createElement('p');p.className='err';p.textContent=t;M.appendChild(p)}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function b64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
function hex(c){return /^#[0-9a-f]{6}$/i.test(c)?c:null}
async function decode(){var h=location.hash.replace(/^#/,'');var m=/(?:^|&)m=([zj])([A-Za-z0-9_-]+)/.exec(h);if(!m)throw 0;var bytes=b64(m[2]);
 if(m[1]==='z'){if(typeof DecompressionStream==='undefined')throw 'old';var ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(ds).arrayBuffer())}
 return JSON.parse(new TextDecoder().decode(bytes))}
function render(d){if(!d||d.v!==1||!Array.isArray(d.S))throw 0;
 var c=Array.isArray(d.c)?d.c:[],R=document.documentElement.style;if(hex(c[0]))R.setProperty('--bg',c[0]);if(hex(c[1]))R.setProperty('--tx',c[1]);if(hex(c[2]))R.setProperty('--ac',c[2]);
 if(typeof d.f==='string'&&/^[A-Za-z0-9 ]{2,40}$/.test(d.f)){var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(d.f).replace(/%20/g,'+')+':wght@400;700&display=swap';document.head.appendChild(l);R.setProperty('--fh','"'+d.f+'",Georgia,serif')}
 var name=String(d.n||'').slice(0,80);document.title=name||'Menu';M.innerHTML='';
 var hd=el('header');hd.appendChild(el('h1',null,name));if(d.s)hd.appendChild(el('p','sub',String(d.s).slice(0,160)));M.appendChild(hd);
 var secs=d.S.filter(function(s){return Array.isArray(s)&&(s[0]||Array.isArray(s[1])&&s[1].length)}).slice(0,40);
 if(secs.length>1){var nv=el('nav');nv.setAttribute('aria-label',T.all);secs.forEach(function(s,i){var a=el('a',null,String(s[0]||('#'+(i+1))).slice(0,40));a.href='#s'+i;a.onclick=function(e){e.preventDefault();var t=document.getElementById('s'+i);if(t)t.scrollIntoView({behavior:'smooth'})};nv.appendChild(a)});M.appendChild(nv)}
 secs.forEach(function(s,i){var se=el('section');se.id='s'+i;if(s[0])se.appendChild(el('h2',null,String(s[0]).slice(0,80)));var ul=el('ul');
  (Array.isArray(s[1])?s[1]:[]).slice(0,80).forEach(function(it){if(!Array.isArray(it))return;var li=el('li'),r=el('div','r');r.appendChild(el('span','n',String(it[0]||'').slice(0,120)));if(it[1]){r.appendChild(el('span','d'));r.appendChild(el('span','p',String(it[1]).slice(0,30)))}li.appendChild(r);if(it[2])li.appendChild(el('p','x',String(it[2]).slice(0,240)));ul.appendChild(li)});
  se.appendChild(ul);M.appendChild(se)});
 if(d.m)M.appendChild(el('p','note',String(d.m).slice(0,200)));
 var ft=el('footer');var a=el('a',null,T.made);a.href='./';ft.appendChild(a);M.appendChild(ft)}
decode().then(render).catch(function(e){err(e==='old'?T.old:T.bad)});
addEventListener('hashchange',function(){decode().then(render).catch(function(e){err(e==='old'?T.old:T.bad)})});
})();
</script>
</body></html>
